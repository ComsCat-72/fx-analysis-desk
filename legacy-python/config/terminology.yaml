# User-controlled terminology dictionary.
# Terms are only ever added here by the user; the system never adds terms from source material.

approved:
  - term: support
    definition: "A price area where declines have previously stopped or reversed."
    alternatives: [support area, support zone]
    prohibited_alternatives: [demand zone, "bullish order block"]
  - term: resistance
    definition: "A price area where advances have previously stopped or reversed."
    alternatives: [resistance area, resistance zone]
    prohibited_alternatives: [supply zone, "bearish order block"]
  - term: sustained break
    definition: "The configured number of consecutive candle closes beyond a boundary on the break timeframe (see config/app.yaml technical.breaks)."
    alternatives: [sustained move above, sustained move below]
    prohibited_alternatives: [displacement]
  - term: market structure
    definition: "The sequence of confirmed swing highs and lows. Upward structure = higher highs and higher lows; downward = lower highs and lower lows; otherwise mixed."
    alternatives: [price structure]
    prohibited_alternatives: []
  - term: rejection
    definition: "Price trades beyond a boundary but the candle closes back on the original side."
    alternatives: [failed break]
    prohibited_alternatives: [liquidity sweep, stop hunt]
  - term: range
    definition: "A period where price is contained between an identified support and resistance area."
    alternatives: [price range, consolidation]
    prohibited_alternatives: []
  - term: higher high / higher low / lower high / lower low
    definition: "Comparisons between consecutive confirmed swing points."
    alternatives: []
    prohibited_alternatives: []
  - term: rate expectations
    definition: "Market pricing or reported expectations of future central-bank policy rates."
    alternatives: [policy expectations]
    prohibited_alternatives: []
  - term: risk sentiment
    definition: "Broad willingness of investors to hold riskier assets, as reflected in reported market behaviour."
    alternatives: [risk appetite]
    prohibited_alternatives: [risk-on/risk-off without evidence]

# Phrases blocked by default. Each has a plain-language replacement suggestion.
prohibited:
  - {phrase: smart money, suggest: "describe the observed price behaviour"}
  - {phrase: institutional manipulation, suggest: "remove; intent cannot be inferred from price"}
  - {phrase: liquidity grab, suggest: "brief move beyond the level followed by a close back inside"}
  - {phrase: liquidity hunt, suggest: "brief move beyond the level"}
  - {phrase: liquidity sweep, suggest: "brief move beyond the level followed by a close back inside"}
  - {phrase: stop hunt, suggest: "brief move beyond the level"}
  - {phrase: order block, suggest: "support or resistance area"}
  - {phrase: fair value gap, suggest: "price area with little trading on the way up/down"}
  - {phrase: imbalance, suggest: "fast move with little overlap between candles"}
  - {phrase: mitigation block, suggest: "support or resistance area"}
  - {phrase: breaker block, suggest: "former support now acting as resistance (or the reverse)"}
  - {phrase: inducement, suggest: "remove"}
  - {phrase: premium/discount, suggest: "upper / lower part of the range"}
  - {phrase: discount array, suggest: "lower part of the range"}
  - {phrase: premium array, suggest: "upper part of the range"}
  - {phrase: kill zone, suggest: "name the session, e.g. the London session"}
  - {phrase: killzone, suggest: "name the session"}
  - {phrase: sniper entry, suggest: "remove"}
  - {phrase: institutional footprint, suggest: "remove"}
  - {phrase: guaranteed setup, suggest: "remove"}
  - {phrase: market makers, suggest: "remove unsupported claims about intent"}
  - {phrase: bullish delivery, suggest: "upward momentum"}
  - {phrase: bearish delivery, suggest: "downward momentum"}
  - {phrase: displacement, suggest: "strong directional move"}

# Chart abbreviations. Disabled ones are blocked in reports and must be translated.
abbreviations:
  BOS:
    enabled: false
    plain: "price moved above the previous swing high (or below the previous swing low)"
  CHoCH:
    enabled: false
    plain: "price broke the most recent swing point against the prior direction"
  MSS:
    enabled: false
    plain: "change in the sequence of swing highs and lows"
  FVG:
    enabled: false
    plain: "price area with little trading on the way through"
  OB:
    enabled: false
    plain: "support or resistance area"
