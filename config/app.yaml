# FX Analysis Desk: main configuration.
# Everything here can be changed without code edits. Secrets live in .env, never here.

display:
  # IANA zone used for every time shown to readers. Africa/Kampala = EAT (UTC+3, no DST).
  # Note: Africa/Kigali is CAT (UTC+2), one hour behind EAT.
  timezone: Africa/Kampala
  timezone_label: EAT
  show_source_timestamps: true

# Session definitions. Candle boundaries are computed from these with zoneinfo,
# so daylight-saving changes in the anchor zone are handled automatically.
sessions:
  fx_ny_close:
    description: "Spot FX day ends 17:00 New York; week runs Sunday 17:00 to Friday 17:00 New York."
    anchor_timezone: America/New_York
    daily_close: "17:00"
    week_open_weekday: 6     # Sunday (Mon=0)
    week_close_weekday: 4    # Friday
  us_equity_cash:
    description: "US cash equity session 09:30-16:00 New York (Nasdaq-100 index); hourly bars start at :30."
    anchor_timezone: America/New_York
    daily_close: "16:00"
    week_open_weekday: 6
    week_close_weekday: 4
    expected_h1_bars: 7
  # Market holidays (trading days with no daily candle expected), ISO dates.
  holidays: []

default_session: fx_ny_close

timeframes:
  context: [W1, D1]
  structure: H1

# Each instrument names its price provider and the symbol used there. Free sources:
#   twelvedata - free personal API key (TWELVEDATA_API_KEY); spot FX and XAU/USD
#   yahoo      - no key, unofficial (personal use); official DXY and Nasdaq-100 index levels, FX fallback
#   oanda      - free practice account where available
#   fixture    - synthetic development data
instruments:
  GBP_USD:
    display: GBP/USD
    base: GBP
    quote: USD
    kind: fx_spot
    decimals: 5
    price_provider: twelvedata
    symbols: {twelvedata: GBP/USD, yahoo: GBPUSD=X, oanda: GBP_USD}
    enabled: true
  EUR_USD:
    display: EUR/USD
    base: EUR
    quote: USD
    kind: fx_spot
    decimals: 5
    price_provider: twelvedata
    symbols: {twelvedata: EUR/USD, yahoo: EURUSD=X, oanda: EUR_USD}
    enabled: true
  AUD_USD:
    display: AUD/USD
    base: AUD
    quote: USD
    kind: fx_spot
    decimals: 5
    price_provider: twelvedata
    symbols: {twelvedata: AUD/USD, yahoo: AUDUSD=X, oanda: AUD_USD}
    enabled: true
  NZD_USD:
    display: NZD/USD
    base: NZD
    quote: USD
    kind: fx_spot
    decimals: 5
    price_provider: twelvedata
    symbols: {twelvedata: NZD/USD, yahoo: NZDUSD=X, oanda: NZD_USD}
    enabled: true
  USD_CHF:
    display: USD/CHF
    base: USD
    quote: CHF
    kind: fx_spot
    decimals: 5
    price_provider: twelvedata
    symbols: {twelvedata: USD/CHF, yahoo: CHF=X, oanda: USD_CHF}
    enabled: true
  XAU_USD:
    display: XAU/USD
    base: XAU
    quote: USD
    kind: metal_spot
    decimals: 2
    price_provider: twelvedata
    # No free spot gold on Yahoo (only GC=F futures, which must not be mixed with spot).
    symbols: {twelvedata: XAU/USD, oanda: XAU_USD}
    enabled: true
  DXY:
    display: DXY
    base: USD
    quote: BASKET
    kind: index
    decimals: 3
    price_provider: yahoo
    symbols: {yahoo: DX-Y.NYB}
    label: "ICE US Dollar Index level as published via Yahoo Finance."
    enabled: true
  NAS100:
    display: Nasdaq-100
    base: NAS100
    quote: USD
    kind: index_cash
    decimals: 2
    session: us_equity_cash
    price_provider: yahoo
    symbols: {yahoo: "^NDX"}
    label: "Nasdaq-100 cash index level (09:30-16:00 New York), via Yahoo Finance; not futures or a CFD."
    enabled: true

providers:
  prices:
    # Default when an instrument names no provider. PRICE_PROVIDER in the environment overrides
    # every instrument (e.g. PRICE_PROVIDER=yahoo for a no-key setup, fixture for offline work).
    primary: twelvedata
    # Hours after the Sunday 17:00 New York open before a source's week starts (measured from live data):
    # Yahoo FX starts 2 hours later, so Monday sessions have 22 of 24 hourly bars. Allowed on Mondays and disclosed.
    week_open_delay_hours: {yahoo: 2}
    price_component: M        # OANDA only: M = mid. Each series keeps one provider and price type; never mixed.
    stale_after_seconds: 300
  calendar:
    primary: ff_weekly_json   # schedule + forecast + previous only (no actuals)
    actuals: manual           # manual | official adapters (see docs/providers.md)
  central_banks:
    feeds: [fed, ecb, boe, rba, rbnz, snb]
  yields:
    primary: fred
  news:
    primary: manual           # Reuters/WSJ require a licence; headlines are user-entered with links.
  conflicts:
    # Relative tolerance before two providers' prices are treated as conflicting.
    price_relative_tolerance: 0.0002

technical:
  # Free feeds occasionally skip an hourly bar. A session missing at most this many hours still counts
  # as complete; reports disclose "built from N of M hourly bars". 0 = strict.
  max_missing_h1_bars: 1
  swings:
    left_bars: 3
    right_bars: 3             # a swing is confirmed only after this many later bars close
  atr_period: 14
  moving_averages:
    - {type: SMA, period: 20}
    - {type: SMA, period: 50}
    - {type: EMA, period: 20}
  rsi:
    enabled: false
    period: 14
  breaks:
    basis: close              # close | wick. Close = candle close beyond the boundary.
    timeframe: H1
    sustained_closes: 2       # consecutive closes beyond the boundary needed for a sustained break
    reversal_closes: 1        # closes back through the opposite side after confirmation = reversed

evaluation:
  wording: assessment         # assessment | correct_incorrect (display only; distinctions are kept)
  # A net move smaller than this fraction of daily ATR is "Inconclusive".
  inconclusive_atr_fraction: 0.25
  # If the session also moved this many ATRs against the final direction, the result is "Mixed".
  mixed_excursion_atr_fraction: 0.5

reports:
  publication_mode: manual    # manual | automatic (automatic must be explicitly enabled)
  writer: claude              # claude | template (template = offline, deterministic sentences only)
  length_words:
    daily_analysis: [250, 400]
    daily_review: [250, 400]
    weekly_analysis: [400, 650]
    weekly_review: [450, 700]
  partial_publication: block  # block | label (label = publish a clearly marked partial report)

schedules:
  # Cron expressions in the display timezone.
  weekly_analysis: "0 20 * * 0"   # Sunday 20:00 EAT
  daily_analysis: "30 8 * * 1-5"  # weekdays 08:30 EAT
  daily_review: "30 7 * * 2-6"    # Tue-Sat 07:30 EAT (reviews the previous session)
  weekly_review: "0 10 * * 6"     # Saturday 10:00 EAT
  retries: 3
  backoff_seconds: [30, 120, 600]

delivery:
  enabled: false              # external delivery only if explicitly enabled
  channels: []
