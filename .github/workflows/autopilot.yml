# Autopilot: Claude writes the reports on schedule, they are committed to reports/, and the site is
# published to GitHub Pages. Times are UTC (EAT = UTC+3). Needs the repository secret ANTHROPIC_API_KEY.
name: Autopilot reports
on:
  schedule:
    - cron: "0 17 * * 0"     # Sun 20:00 EAT  -> weekly analysis for the coming week
    - cron: "30 4 * * 1-5"   # Mon-Fri 07:30 EAT -> previous session review (Tue-Fri) + daily analysis
    - cron: "0 7 * * 6"      # Sat 10:00 EAT  -> Friday review + weekly review
  workflow_dispatch:
    inputs:
      kind:
        description: "Report type (leave empty = whatever is due today)"
        type: choice
        options: ["", weekly_analysis, daily_analysis, daily_review, weekly_review]
        default: ""
      instruments:
        description: "Instrument codes, space-separated (empty = all scheduled)"
        default: ""
      date:
        description: "Report date YYYY-MM-DD (empty = today)"
        default: ""
      force:
        description: "Rewrite even if the report already exists"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["reports/**", "autopilot/**"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: autopilot
  cancel-in-progress: false
jobs:
  reports:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install anthropic httpx pyyaml markdown
      - name: Write reports with Claude
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          [ -n "${{ inputs.kind }}" ] && ARGS="$ARGS --kind ${{ inputs.kind }}"
          [ -n "${{ inputs.instruments }}" ] && ARGS="$ARGS --instruments '${{ inputs.instruments }}'"
          [ -n "${{ inputs.date }}" ] && ARGS="$ARGS --date ${{ inputs.date }}"
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          eval python autopilot/generate.py $ARGS || echo "::warning::some reports failed; see the log above"
      - name: Save new reports to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || (git commit -m "Reports $(TZ=Africa/Kampala date '+%a %d %b %Y %H:%M') EAT" && git push)
      - name: Build the website
        run: python autopilot/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
