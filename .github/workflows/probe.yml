# Manual probe of free data sources. Saves raw responses as an artifact so adapters are built
# against real payloads. Run from Actions -> Probe data sources.
name: Probe data sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch samples
        env:
          TD_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) fx-analysis-desk-probe"
          K="${TD_KEY:-demo}"
          get() { curl -sS -A "$UA" --max-time 40 -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2" >> index.txt || echo "$1 FAILED" >> index.txt; }
          get td_eurusd_1h.json "https://api.twelvedata.com/time_series?symbol=EUR/USD&interval=1h&outputsize=30&timezone=UTC&apikey=$K"
          get td_xauusd_1h.json "https://api.twelvedata.com/time_series?symbol=XAU/USD&interval=1h&outputsize=30&timezone=UTC&apikey=$K"
          get td_usdsek_1h.json "https://api.twelvedata.com/time_series?symbol=USD/SEK&interval=1h&outputsize=5&timezone=UTC&apikey=$K"
          get td_quote_eurusd.json "https://api.twelvedata.com/quote?symbol=EUR/USD&apikey=$K"
          get td_ndx.json "https://api.twelvedata.com/time_series?symbol=NDX&interval=1h&outputsize=5&timezone=UTC&apikey=$K"
          get td_dxy.json "https://api.twelvedata.com/time_series?symbol=DXY&interval=1h&outputsize=5&timezone=UTC&apikey=$K"
          get td_usage.json "https://api.twelvedata.com/api_usage?apikey=$K"
          for s in EURUSD=X GBPUSD=X XAUUSD=X GC=F NQ=F %5ENDX DX-Y.NYB; do
            get "yh_${s//[^A-Za-z0-9]/_}.json" "https://query1.finance.yahoo.com/v8/finance/chart/$s?interval=1h&range=5d"
          done
          get yh_EURUSD_1d.json "https://query1.finance.yahoo.com/v8/finance/chart/EURUSD=X?interval=1d&range=1mo"
          get ff_thisweek.json "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
          get fed_press.xml "https://www.federalreserve.gov/feeds/press_all.xml"
          get fed_speeches.xml "https://www.federalreserve.gov/feeds/speeches.xml"
          get ecb_press.xml "https://www.ecb.europa.eu/rss/press.html"
          get boe_news.xml "https://www.bankofengland.co.uk/rss/news"
          get rba.xml "https://www.rba.gov.au/rss/rss-cb-media-releases.xml"
          get rbnz.xml "https://www.rbnz.govt.nz/feeds/news"
          get snb.xml "https://www.snb.ch/public/en/rss/pressrel"
          get frankfurter.json "https://api.frankfurter.app/latest?from=USD"
          cat index.txt
      - name: Publish samples to the probe-data branch (truncated, raw responses only)
        run: |
          cd out
          for f in *; do [ "$f" = index.txt ] || head -c 60000 "$f" > "$f.tmp" && mv "$f.tmp" "$f" 2>/dev/null || true; done
          git init -q && git checkout -q -b probe-data
          git -c user.name=probe -c user.email=probe@users.noreply.github.com add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm "probe samples $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-data
