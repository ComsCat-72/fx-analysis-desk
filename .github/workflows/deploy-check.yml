# Checks a deployed instance end to end and publishes the results to the `deploy-check` branch.
# Needs repository secrets APP_URL and ADMIN_TOKEN. Run from Actions -> Deployment check.
name: Deployment check
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the deployment
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          mkdir -p out && cd out
          if [ -z "$APP_URL" ]; then echo "APP_URL secret is not set" > result.txt; exit 0; fi
          APP_URL="${APP_URL%/}"
          {
            echo "url_set: yes"; echo "token_set: $([ -n "$ADMIN_TOKEN" ] && echo yes || echo no)"
            for i in 1 2 3 4 5 6; do code=$(curl -s -o health.json -w '%{http_code}' --max-time 60 "$APP_URL/api/health"); [ "$code" = 200 ] && break; sleep 15; done
            echo "health: $code $(cat health.json 2>/dev/null)"
            echo "dashboard: $(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$APP_URL/")"
            echo "config: $(curl -s -o config.json -w '%{http_code}' --max-time 60 "$APP_URL/api/config")"
            echo "auth_without_token: $(curl -s -o /dev/null -w '%{http_code}' --max-time 60 -X POST -H 'Content-Type: application/json' -d '{}' "$APP_URL/api/reports/draft")"
            echo "auth_check: $(curl -s --max-time 60 -H "X-Admin-Token: $ADMIN_TOKEN" "$APP_URL/api/auth/check")"
            echo "ingest_GBP_USD: $(curl -s -o ingest.json -w '%{http_code}' --max-time 300 -X POST -H 'Content-Type: application/json' -H "X-Admin-Token: $ADMIN_TOKEN" -d "{\"instrument\":\"GBP_USD\",\"start\":\"$(date -u -d '60 days ago' +%F)\",\"end\":\"$(date -u +%F)\"}" "$APP_URL/api/ingest") $(head -c 400 ingest.json)"
            echo "calendar_refresh: $(curl -s -o cal.json -w '%{http_code}' --max-time 120 -X POST -H "X-Admin-Token: $ADMIN_TOKEN" "$APP_URL/api/calendar/refresh") $(head -c 200 cal.json)"
            echo "draft_daily: $(curl -s -o draft.json -w '%{http_code}' --max-time 300 -X POST -H 'Content-Type: application/json' -H "X-Admin-Token: $ADMIN_TOKEN" -d "{\"instrument\":\"GBP_USD\",\"kind\":\"daily_analysis\",\"period\":\"$(date -u +%F)\"}" "$APP_URL/api/reports/draft")"
            python3 -c "import json;d=json.load(open('draft.json'));print('draft_result:', d.get('status'), d.get('writer'), d.get('data_mode'), 'blocking', d.get('blocking'), d.get('detail',''))" 2>/dev/null || echo "draft_result: $(head -c 400 draft.json)"
            echo "pdf_export: $(python3 -c "import json;print(json.load(open('draft.json'))['id'])" 2>/dev/null | xargs -I{} curl -s -o r.pdf -w '%{http_code} %{size_download}' --max-time 120 "$APP_URL/api/reports/{}/export.pdf?token=$ADMIN_TOKEN")"
          } > result.txt 2>&1
          cat result.txt
      - name: Publish results to the deploy-check branch
        run: |
          cd out && rm -f r.pdf && sed -i 's/"credentials"[^}]*}//' config.json 2>/dev/null || true
          git init -q && git checkout -q -b deploy-check
          git -c user.name=deploy-check -c user.email=deploy-check@users.noreply.github.com add -A
          git -c user.name=deploy-check -c user.email=deploy-check@users.noreply.github.com commit -qm "deploy check $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy-check
