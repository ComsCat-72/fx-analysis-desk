# Manual live check of the free data sources (no secrets needed). Results are pushed to the live-check branch.
name: live-check
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Deployed site to measure
        default: https://fx-analysis-desk.vercel.app
  push:
    branches: [live-check-run]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --experimental-strip-types scripts/site-check.ts
        continue-on-error: true
        env: { SITE_URL: "${{ inputs.site_url }}" }
      - run: node --experimental-strip-types scripts/probe-sources.ts
      - run: node --experimental-strip-types scripts/live-check.ts
        continue-on-error: true
      - name: Publish results to the live-check branch
        run: |
          cd out
          git init -q && git checkout -q -b live-check
          git config user.name live-check && git config user.email live-check@users.noreply.github.com
          git add -A && git commit -qm "live check $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live-check
